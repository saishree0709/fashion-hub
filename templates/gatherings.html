<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Portfolio | Social Gatherings</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Playfair Display', serif;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Inline SVGs to ensure stability without build step) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const ArrowLeft = (props) => (
            <IconWrapper {...props}><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></IconWrapper>
        );
        const ShoppingBag = (props) => (
            <IconWrapper {...props}><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></IconWrapper>
        );
        const CheckCircle = (props) => (
            <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconWrapper>
        );
        const Info = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></IconWrapper>
        );
        const Sparkles = (props) => (
            <IconWrapper {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></IconWrapper>
        );
        const Wine = (props) => (
            <IconWrapper {...props}><path d="M8 22h8" /><path d="M7 10h10" /><path d="M12 15v7" /><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z" /></IconWrapper>
        );
        const Sun = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41-1.41" /><path d="m19.07 4.93-1.41 1.41" /></IconWrapper>
        );
        const Coffee = (props) => (
            <IconWrapper {...props}><path d="M17 8h1a4 4 0 1 1 0 8h-1" /><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" /><line x1="6" y1="1" x2="6" y2="4" /><line x1="10" y1="1" x2="10" y2="4" /><line x1="14" y1="1" x2="14" y2="4" /></IconWrapper>
        );
        const Moon = (props) => (
            <IconWrapper {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></IconWrapper>
        );

        // --- Data ---
        const EVENTS = [
            {
                id: 'dinner',
                title: 'Dinner Party',
                icon: <Wine size={24} />,
                color: 'bg-amber-50 text-amber-900 border-amber-100',
                accent: 'text-amber-600',
                focus: 'Satin, Silk, and Midi lengths',
                checklist: ['Steam the dress', 'Polished Heels', 'Statement Earrings'],
                rule: 'Balance a bold lip with minimal eye makeup.',
                links: [
                    { name: 'Satin Dresses', store: 'Zara', url: 'https://www.zara.com/us/en/search?searchTerm=satin%20dress' },
                    { name: 'Elegant Midis', store: 'Savana', url: 'https://www.savanacustom.com/search?q=midi+dress' }, // Saving placeholder as requested store
                    { name: 'Gold Accessories', store: 'Amazon', url: 'https://www.amazon.com/s?k=gold+jewelry+women' }
                ]
            },
            {
                id: 'cocktail',
                title: 'Cocktail Night',
                icon: <Moon size={24} />,
                color: 'bg-indigo-50 text-indigo-900 border-indigo-100',
                accent: 'text-indigo-600',
                focus: 'Sequins, Mini dresses, Bodycon',
                checklist: ['Seamless Underwear', 'Strappy Heels', 'Clutch Bag'],
                rule: 'Legs or Cleavage - pick one to highlight.',
                links: [
                    { name: 'Party Collection', store: 'Zara', url: 'https://www.zara.com/us/en/woman-party-l1372.html' },
                    { name: 'Velvet Midi', store: 'Savana', url: 'https://www.savanacustom.com/search?q=velvet' },
                    { name: 'Statement Clutch', store: 'Amazon', url: 'https://www.amazon.com/s?k=evening+clutch' }
                ]
            },
            {
                id: 'garden',
                title: 'Outdoor Garden',
                icon: <Sun size={24} />,
                color: 'bg-rose-50 text-rose-900 border-rose-100',
                accent: 'text-rose-600',
                focus: 'Florals, Linens, Pastels',
                checklist: ['Block Heels (Grass!)', 'Light Layer', 'Sunnies'],
                rule: 'Opt for breathable fabrics like linen or cotton.',
                links: [
                    { name: 'Linen Collection', store: 'Zara', url: 'https://www.zara.com/us/en/search?searchTerm=linen' },
                    { name: 'Floral Maxi', store: 'Savana', url: 'https://www.savanacustom.com/search?q=floral+maxi' },
                    { name: 'Sun Hats', store: 'Amazon', url: 'https://www.amazon.com/s?k=sun+hat+women' }
                ]
            },
            {
                id: 'casual',
                title: 'Casual Social',
                icon: <Coffee size={24} />,
                color: 'bg-emerald-50 text-emerald-900 border-emerald-100',
                accent: 'text-emerald-600',
                focus: 'Knitwear, Oversized, Denim',
                checklist: ['Clean Sneakers', 'Tote Bag', 'Minimal Jewelry'],
                rule: 'Elevate basics with high-quality textures.',
                links: [
                    { name: 'Denim', store: 'Zara', url: 'https://www.zara.com/us/en/woman-jeans-l1119.html' },
                    { name: 'Co-ords', store: 'Savana', url: 'https://www.savanacustom.com/search?q=coords' },
                    { name: 'Basic Tees', store: 'Amazon', url: 'https://www.amazon.com/s?k=quality+basics+women' }
                ]
            }
        ];

        // --- Components ---

        const Nav = () => (
            <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
                <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                    <a href="/" className="flex items-center gap-2 text-slate-500 hover:text-slate-900 transition group">
                        <ArrowLeft size={18} className="group-hover:-translate-x-1 transition-transform" />
                        <span className="font-medium text-sm">Back to Hub</span>
                    </a>
                    <h1 className="text-xl font-bold tracking-tight italic">Style Portfolio</h1>
                    <div className="w-20"></div> {/* Spacer */}
                </div>
            </nav>
        );

        const EventCard = ({ event, isSelected, onClick }) => (
            <button
                onClick={() => onClick(event)}
                className={`
                    relative p-6 rounded-3xl border text-left transition-all duration-300 w-full group
                    ${isSelected
                        ? `${event.color} shadow-lg scale-[1.02] ring-1 ring-offset-2 ring-slate-200`
                        : 'bg-white border-slate-100 hover:border-slate-300 hover:shadow-md text-slate-600'}
                `}
            >
                <div className="flex items-start justify-between mb-4">
                    <div className={`p-3 rounded-2xl ${isSelected ? 'bg-white/50' : 'bg-slate-50 group-hover:bg-slate-100'} transition-colors`}>
                        {/* We use specific icons mapped in data, normally we'd dynamically render lucid icons but passing the component works here */}
                        <div className={isSelected ? event.accent : 'text-slate-400'}>
                            {/* Since we can't easily dynamically pick icons by string in simple CDN react without a map, we passed the initialized component in data */}
                            {event.icon}
                        </div>
                    </div>
                    {isSelected && <CheckCircle size={20} className={event.accent} />}
                </div>
                <div>
                    <h3 className="font-bold text-lg mb-1">{event.title}</h3>
                    <p className="text-xs opacity-80 font-medium">Click to Styling Profile</p>
                </div>
            </button>
        );

        const Dashboard = ({ event }) => {
            if (!event) return (
                <div className="text-center py-20 text-slate-400 fade-in">
                    <Sparkles size={48} className="mx-auto mb-4 opacity-20" />
                    <p className="font-serif text-xl">Select an event to view your curated portfolio</p>
                </div>
            );

            return (
                <div className="grid md:grid-cols-3 gap-8 fade-in" key={event.id}>
                    {/* Main Content - Shopping & Inspiration */}
                    <div className="md:col-span-2 space-y-8">

                        {/* Header */}
                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm relative overflow-hidden">
                            <div className={`absolute top-0 right-0 w-32 h-32 rounded-full blur-3xl -mr-16 -mt-16 opacity-20 ${event.color.split(' ')[0]}`}></div>
                            <h2 className="text-3xl font-bold mb-2 text-slate-900">{event.title} Collection</h2>
                            <p className="text-slate-500 font-medium flex items-center gap-2">
                                <Info size={16} /> Focus: <span className="text-slate-800">{event.focus}</span>
                            </p>
                        </div>

                        {/* Shopping Links Grid */}
                        <div className="grid sm:grid-cols-2 gap-4">
                            {event.links.map((link, idx) => (
                                <a
                                    href={link.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    key={idx}
                                    className="group bg-white p-5 rounded-2xl border border-slate-100 hover:border-slate-300 hover:shadow-lg transition-all flex items-center justify-between"
                                >
                                    <div>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">{link.store}</p>
                                        <p className="font-serif text-lg text-slate-800 group-hover:text-indigo-600 transition-colors">{link.name}</p>
                                    </div>
                                    <ShoppingBag size={20} className="text-slate-300 group-hover:text-indigo-600 transition-colors" />
                                </a>
                            ))}

                            {/* Generic "View All" */}
                            <a
                                href="https://www.google.com/search?q=trending+fashion+styles"
                                target="_blank"
                                className="group bg-slate-900 p-5 rounded-2xl text-white shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all flex items-center justify-between"
                            >
                                <div>
                                    <p className="text-xs font-bold opacity-60 uppercase tracking-wider mb-1">Explore</p>
                                    <p className="font-serif text-lg">Browse More Looks</p>
                                </div>
                                <Sparkles size={20} />
                            </a>
                        </div>
                    </div>

                    {/* Sidebar - Rules & Checklist */}
                    <div className="space-y-6">
                        {/* Master Rule */}
                        <div className={`p-6 rounded-3xl border border-transparent ${event.color}`}>
                            <h3 className="font-bold text-lg mb-3 flex items-center gap-2">
                                <Sparkles size={18} /> Master Style Rule
                            </h3>
                            <p className="font-serif text-xl italic leading-relaxed opacity-90">
                                "{event.rule}"
                            </p>
                        </div>

                        {/* Checklist */}
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 className="font-bold text-slate-900 mb-4">Fitting Checklist</h3>
                            <ul className="space-y-3">
                                {event.checklist.map((item, idx) => (
                                    <li key={idx} className="flex items-center gap-3 text-slate-600">
                                        <div className={`w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${event.color.split(' ')[0]}`}>
                                            <CheckCircle size={12} className={event.accent} />
                                        </div>
                                        <span className="text-sm font-medium">{item}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedEvent, setSelectedEvent] = useState(null);

            return (
                <div className="min-h-screen pb-20">
                    <Nav />

                    {/* Main Container */}
                    <main className="max-w-7xl mx-auto px-6 pt-12">

                        {/* Header Section */}
                        <div className="text-center max-w-2xl mx-auto mb-16">
                            <p className="text-xs font-bold tracking-widest text-slate-400 uppercase mb-3">Curated Fashion Intelligence</p>
                            <h1 className="text-5xl md:text-6xl font-black text-slate-900 mb-6 tracking-tight">
                                Select Your <span className="text-transparent bg-clip-text bg-gradient-to-r from-slate-700 to-slate-400">Occasion</span>
                            </h1>
                            <p className="text-lg text-slate-500 font-light">
                                Expertly curated outfit formulas, shopping links, and styling rules tailored to where you're going.
                            </p>
                        </div>

                        {/* Event Selector Grid */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-16">
                            {EVENTS.map(event => (
                                <EventCard
                                    key={event.id}
                                    event={event}
                                    isSelected={selectedEvent?.id === event.id}
                                    onClick={setSelectedEvent}
                                />
                            ))}
                        </div>

                        {/* Dynamic Dashboard */}
                        <div className="min-h-[400px]">
                            <Dashboard event={selectedEvent} />
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
